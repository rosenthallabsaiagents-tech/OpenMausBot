workflows:
  ios-unsigned-ipa:
    name: Build Unsigned iOS IPA (Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate
      - name: Build unsigned .ipa
        script: |
          cd apps/ios
          xcodebuild \
            -project OpenMausBot.xcodeproj \
            -scheme OpenMausBot \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/OpenMausBot.app output/Payload/
          cd output
          zip -r ../../OpenMausBot-unsigned.ipa Payload
    artifacts:
      - OpenMausBot-unsigned.ipa
